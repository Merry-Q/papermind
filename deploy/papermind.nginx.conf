limit_req_zone $binary_remote_addr zone=papermind_api:1m rate=15r/s;

server {
    listen 80;
    server_name papermind.47.237.109.221.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name papermind.47.237.109.221.sslip.io;
    ssl_certificate /usr/local/openresty/nginx/conf/conf.d/secure/letsencrypt/live/papermind.47.237.109.221.sslip.io/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/conf.d/secure/letsencrypt/live/papermind.47.237.109.221.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 22m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        limit_req zone=papermind_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:18001;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18001;
    }
}
